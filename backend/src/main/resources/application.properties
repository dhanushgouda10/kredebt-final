# Optional local .env file (gitignored). Lets you keep MAIL_PASSWORD and friends out of your shell
# history and out of source control: copy backend/.env.example to backend/.env and run the app from
# the backend/ directory. Real environment variables always win over the file.
# Looks in the working directory first, then backend/ (when the app is started from the project root).
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# DB_URL: use jdbc:postgresql://... or paste Supabase postgresql://... (normalized at startup).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
# JWT_SECRET must be a long, random string in real deployments (32+ chars). The
# fallback below is only for local dev and is intentionally obvious so nobody
# ships it by accident.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed (creates one admin row on startup if ADMIN_WALLET_ADDRESS is set).
# No default address: a hardcoded fallback would silently grant admin rights to a
# wallet published in this repository. Unset means no admin is seeded.
admin.seed.email=${ADMIN_EMAIL:}
admin.seed.full-name=${ADMIN_FULL_NAME:Kredent Admin}
admin.seed.wallet-address=${ADMIN_WALLET_ADDRESS:}

# Supabase Storage — service role key is server-side only, never sent to the frontend.
# Get these from Project Settings > API in your Supabase dashboard.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:certificates}

# Certificate file upload — this is the real, user-facing limit (clear error message).
app.certificate.max-file-size-mb=${CERTIFICATE_MAX_FILE_SIZE_MB:5}

# Phase 11 (QR stamping) — the origin the QR code (baked into every issued certificate PDF)
# points at, e.g. https://kredent.example.com in production. No trailing slash. The QR encodes
# "<this>/verify/<certificateNumber>" — the same public, unauthenticated page Phase 9 already
# serves. Defaults to the local Vite dev server so QR codes generated while developing still
# resolve to something real on this machine.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Transactional email (Resend). Both values are supplied by the environment and
# are NEVER committed. Leaving EMAIL_API_KEY unset disables notification emails
# entirely — the app still runs and registration still succeeds, it simply reports
# emailSent=false. Nothing is faked.
#
# SENDER LIMITATION: Resend only delivers from a verified domain. With the default
# onboarding@resend.dev sender, mail reaches ONLY the address on the Resend account
# that owns the API key. Reaching real student mailboxes requires verifying a
# domain you control (SPF + DKIM DNS records).
email.api-key=${EMAIL_API_KEY:}
email.from=${EMAIL_FROM:onboarding@resend.dev}

# Spring's own multipart ceiling, set a bit above the business limit above so our own
# validation (with a clearer message) rejects oversized files before Spring's generic one does.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=8081

# CORS_ALLOWED_ORIGINS: optional, comma-separated EXTRA origins on top of the two localhost
# origins CorsConfig.java always allows. In production, set this to the deployed Azure Static
# Web Apps frontend URL (e.g. https://kredent.azurestaticapps.net) — never hardcoded here,
# never committed, set as an Azure App Service application setting.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Blockchain (Phase 3) — read-only. The admin's MetaMask signs and submits the
# issue/revoke transaction directly from the browser; the backend only reads the
# resulting transaction receipt back from this RPC endpoint to verify it before
# trusting it. No admin/blockchain private key is ever configured here.
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.network=${BLOCKCHAIN_NETWORK:amoy}
blockchain.contract-address=${SMART_CONTRACT_ADDRESS:0xD96cA244Cf4677Be2bc7E5AF28908c573d335A5C}
# Falls back to ADMIN_WALLET_ADDRESS if a separate BLOCKCHAIN_ADMIN_WALLET_ADDRESS
# isn't set — in this project there is only one admin wallet, used for both login
# and on-chain issuing, so most setups only need to set ADMIN_WALLET_ADDRESS once.
blockchain.admin-wallet-address=${BLOCKCHAIN_ADMIN_WALLET_ADDRESS:${ADMIN_WALLET_ADDRESS:0xaB07a51fd2daBCceF287f0D3FFbce0a6D3297C3B}}

# AES-256 secret used to encrypt each student's system-managed wallet private key at
# rest (see WalletService). Backend-only, never sent to the frontend. Set this to a
# long random string in real use — the fallback below is dev-only and obvious on purpose.
wallet.encryption-secret=${WALLET_ENCRYPTION_SECRET:dev-only-insecure-wallet-secret-change-me}

# ------------------------------------------------------------------------------------------
# Gmail SMTP (OTP delivery) — Spring Boot JavaMailSender.
# Everything comes from the environment; MAIL_PASSWORD is a Gmail *App Password* and is never
# committed, never logged and never sent to the frontend. Left empty, the app still starts and
# the OTP endpoints answer 503 "email service not configured" instead of pretending to send.
# ------------------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Kredent}

# ------------------------------------------------------------------------------------------
# OTP policy (college-administrator verification and registry email verification)
# ------------------------------------------------------------------------------------------
otp.ttl-seconds=300
otp.max-attempts=5
otp.resend-cooldown-seconds=60
# Failed guesses allowed across ALL OTPs of one institution inside the window below, so that
# requesting fresh OTPs cannot be used to keep guessing forever.
otp.max-failures-per-window=15
otp.failure-window-minutes=30
# How long a verified OTP session stays usable for the wallet step.
otp.verified-session-minutes=15
# Secret mixed into every stored OTP hash. Falls back to JWT_SECRET when unset.
otp.hmac-secret=${OTP_HMAC_SECRET:}
# Show only a masked HOI email (a***@college.edu) on the public lookup screen. Set to false to show
# the full registered address.
institution.mask-hoi-email=${MASK_HOI_EMAIL:true}

# ------------------------------------------------------------------------------------------
# Simulated institutional registry (DEMO ONLY — not an official AICTE service).
# Separate SQLite file, isolated from PostgreSQL.
# ------------------------------------------------------------------------------------------
registry.db-path=${REGISTRY_DB_PATH:./data/registry.db}
registry.seed-sample-data=${REGISTRY_SEED_SAMPLE_DATA:true}
# Registry administrator. If REGISTRY_ADMIN_PASSWORD is unset a random password is generated once
# and printed to the console at first start (dev convenience) — it is never a fixed default.
registry.admin.email=${REGISTRY_ADMIN_EMAIL:registry.admin@kredent.local}
registry.admin.password=${REGISTRY_ADMIN_PASSWORD:}
# HOI email applied to the seeded sample colleges so OTPs reach a mailbox you control while testing.
registry.demo-hoi-email=${REGISTRY_DEMO_HOI_EMAIL:}

# One-off: registry institutional ID that owns students/certificates created before multi-institution support.
institution.adopt-legacy-data-for=${INSTITUTION_ADOPT_LEGACY_DATA_FOR:}
