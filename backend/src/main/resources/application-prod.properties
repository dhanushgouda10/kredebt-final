# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# Every secret below MUST come from the environment. SecretsValidator refuses to
# start the application if any is missing, too short, or still contains a
# development placeholder — see config/SecretsValidator.java.
#
# Nothing in this file may contain a literal secret or a localhost URL.

# Schema changes are not applied automatically in production. `update` can silently
# alter a live schema; `validate` fails loudly instead if entities and tables drift.
spring.jpa.hibernate.ddl-auto=validate

# API documentation is not published publicly in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Health probe only. Never expose env/beans/configprops/mappings.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Do not leak stack traces to clients.
server.error.include-stacktrace=never
server.error.include-message=never

# Quieter logs in production; raise selectively when diagnosing.
logging.level.root=INFO
logging.level.com.kredent.backend=INFO
